<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" font-family="PingFang SC, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8ec"/>
      <stop offset="50%" stop-color="#a8a8b0"/>
      <stop offset="100%" stop-color="#5c5c64"/>
    </linearGradient>
    <linearGradient id="metalHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f4"/>
      <stop offset="100%" stop-color="#8c8c94"/>
    </linearGradient>
    <linearGradient id="hw_wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9a86b"/>
      <stop offset="100%" stop-color="#a87042"/>
    </linearGradient>
  </defs>

  <rect width="980" height="680" fill="#fbf7ef"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#3c2a18">Ch.4  五金 & 辅料清单</text>
  <text x="490" y="58" text-anchor="middle" font-size="12" fill="#7a5a38">所有螺丝都使用沉头自攻螺丝；预钻孔可避免木条开裂</text>

  <!-- Screw type 1: 4 × 50 mm for leg → apron -->
  <g transform="translate(70,110)">
    <text x="0" y="0" font-weight="bold" font-size="14" fill="#3c2a18">① 4 × 50 mm 沉头螺丝</text>
    <text x="0" y="20" font-size="11" fill="#7a5a38">连接 腿 ↔ 围裙；从围裙内侧斜打或外侧直打</text>

    <!-- Screw illustration (horizontal) -->
    <g transform="translate(0,40)">
      <!-- Head -->
      <polygon points="0,0 14,-9 14,29 0,20" fill="url(#metalHead)" stroke="#3c3c40" stroke-width="0.6"/>
      <!-- Shaft -->
      <rect x="14" y="4" width="110" height="12" fill="url(#metal)" stroke="#3c3c40" stroke-width="0.6"/>
      <!-- Thread (zigzag) -->
      <path d="M14,4 L18,7 L22,4 L26,7 L30,4 L34,7 L38,4 L42,7 L46,4 L50,7 L54,4 L58,7 L62,4 L66,7 L70,4 L74,7 L78,4 L82,7 L86,4 L90,7 L94,4 L98,7 L102,4 L106,7 L110,4 L114,7 L118,4 L122,7 L124,4 L124,16 L122,13 L118,16 L114,13 L110,16 L106,13 L102,16 L98,13 L94,16 L90,13 L86,16 L82,13 L78,16 L74,13 L70,16 L66,13 L62,16 L58,13 L54,16 L50,13 L46,16 L42,13 L38,16 L34,13 L30,16 L26,13 L22,16 L18,13 L14,16 Z" fill="#888" opacity="0.45" stroke="none"/>
      <!-- Tip -->
      <polygon points="124,4 138,10 124,16" fill="url(#metal)" stroke="#3c3c40" stroke-width="0.6"/>

      <!-- dims -->
      <line x1="0" y1="35" x2="138" y2="35" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="0" y1="30" x2="0" y2="40" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="138" y1="30" x2="138" y2="40" stroke="#5a3c20" stroke-width="0.5"/>
      <text x="69" y="50" text-anchor="middle" font-size="11" fill="#5a3c20">长 50 mm</text>
    </g>

    <text x="0" y="125" font-size="13" font-weight="bold" fill="#c4392e">数量：8 颗</text>
    <text x="0" y="142" font-size="10" fill="#7a5a38">每条腿与围裙连接处 2 颗（4 腿 × 2 = 8）</text>
  </g>

  <!-- Screw type 2: 4 × 30 mm for board → apron -->
  <g transform="translate(370,110)">
    <text x="0" y="0" font-weight="bold" font-size="14" fill="#3c2a18">② 4 × 30 mm 沉头螺丝</text>
    <text x="0" y="20" font-size="11" fill="#7a5a38">从围裙顶面向上固定凳面板（不会穿透 1 cm 板面）</text>

    <g transform="translate(0,40)">
      <polygon points="0,0 14,-9 14,29 0,20" fill="url(#metalHead)" stroke="#3c3c40" stroke-width="0.6"/>
      <rect x="14" y="4" width="60" height="12" fill="url(#metal)" stroke="#3c3c40" stroke-width="0.6"/>
      <path d="M14,4 L18,7 L22,4 L26,7 L30,4 L34,7 L38,4 L42,7 L46,4 L50,7 L54,4 L58,7 L62,4 L66,7 L70,4 L74,7 L74,16 L70,13 L66,16 L62,13 L58,16 L54,13 L50,16 L46,13 L42,16 L38,13 L34,16 L30,13 L26,16 L22,13 L18,16 L14,16 Z" fill="#888" opacity="0.45"/>
      <polygon points="74,4 88,10 74,16" fill="url(#metal)" stroke="#3c3c40" stroke-width="0.6"/>

      <line x1="0" y1="35" x2="88" y2="35" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="0" y1="30" x2="0" y2="40" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="88" y1="30" x2="88" y2="40" stroke="#5a3c20" stroke-width="0.5"/>
      <text x="44" y="50" text-anchor="middle" font-size="11" fill="#5a3c20">长 30 mm</text>
    </g>

    <text x="0" y="125" font-size="13" font-weight="bold" fill="#c4392e">数量：8 颗</text>
    <text x="0" y="142" font-size="10" fill="#7a5a38">凳面 4 边每边 2 颗（共 8）</text>
  </g>

  <!-- Materials: glue, drill bit, sandpaper -->
  <g transform="translate(670,110)" font-size="11" fill="#3c2a18">
    <text x="0" y="0" font-weight="bold" font-size="14">③ 辅料</text>

    <text x="0" y="30">·  木工胶（白胶 / PVA）　≥ 50 g</text>
    <text x="14" y="46" font-size="10" fill="#7a5a38">所有接合面先涂胶再上螺丝</text>

    <text x="0" y="72">·  砂纸：80 / 120 / 240 目各一张</text>

    <text x="0" y="98">·  3 mm 钻头（预钻孔）</text>
    <text x="14" y="114" font-size="10" fill="#7a5a38">螺纹直径 4 mm → 钻头取 3 mm</text>

    <text x="0" y="140">·  木蜡油 / 清漆（可选）</text>
  </g>

  <!-- ============ 螺丝位置示意 ============ -->
  <text x="490" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c2a18">─── 螺丝位置示意（剖切视图） ───</text>

  <!-- Diagram: corner joint cross-section -->
  <g transform="translate(120,340)">
    <text x="0" y="-10" font-size="13" font-weight="bold" fill="#3c2a18">A. 腿 ↔ 围裙接合（俯视局部）</text>

    <!-- Leg cross-section (top view: 4cm wide x 4cm wide effectively; we render at 80px) -->
    <rect x="0" y="0" width="80" height="80" fill="url(#hw_wood)" stroke="#5a3c20" stroke-width="1"/>
    <text x="40" y="44" text-anchor="middle" font-size="11" fill="#fff">腿</text>

    <!-- Apron 1 (long) -->
    <rect x="80" y="20" width="200" height="30" fill="url(#hw_wood)" stroke="#5a3c20" stroke-width="1"/>
    <text x="180" y="40" text-anchor="middle" font-size="11" fill="#fff">长围裙 E (36cm)</text>

    <!-- Apron 2 (short) -->
    <rect x="20" y="80" width="30" height="120" fill="url(#hw_wood)" stroke="#5a3c20" stroke-width="1"/>
    <text x="35" y="145" text-anchor="middle" font-size="11" fill="#fff" transform="rotate(-90 35 145)">短围裙 G</text>

    <!-- Screw 1 from long apron into leg -->
    <g transform="translate(150,28)">
      <circle cx="0" cy="0" r="4" fill="url(#metalHead)" stroke="#3c3c40" stroke-width="0.4"/>
      <line x1="0" y1="0" x2="-80" y2="0" stroke="#5c5c64" stroke-width="2"/>
      <line x1="0" y1="0" x2="-80" y2="0" stroke="#888" stroke-width="0.8" stroke-dasharray="2,2"/>
    </g>
    <text x="160" y="20" font-size="9" fill="#c4392e">螺丝① 50mm</text>

    <g transform="translate(150,42)">
      <circle cx="0" cy="0" r="4" fill="url(#metalHead)" stroke="#3c3c40" stroke-width="0.4"/>
      <line x1="0" y1="0" x2="-80" y2="0" stroke="#5c5c64" stroke-width="2"/>
      <line x1="0" y1="0" x2="-80" y2="0" stroke="#888" stroke-width="0.8" stroke-dasharray="2,2"/>
    </g>

    <!-- Screw 2 from short apron into leg -->
    <g transform="translate(28,140)">
      <circle cx="0" cy="0" r="4" fill="url(#metalHead)" stroke="#3c3c40" stroke-width="0.4"/>
      <line x1="0" y1="0" x2="0" y2="-80" stroke="#5c5c64" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="-80" stroke="#888" stroke-width="0.8" stroke-dasharray="2,2"/>
    </g>
    <text x="48" y="148" font-size="9" fill="#c4392e">螺丝① 50mm</text>

    <g transform="translate(42,140)">
      <circle cx="0" cy="0" r="4" fill="url(#metalHead)" stroke="#3c3c40" stroke-width="0.4"/>
      <line x1="0" y1="0" x2="0" y2="-80" stroke="#5c5c64" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="-80" stroke="#888" stroke-width="0.8" stroke-dasharray="2,2"/>
    </g>

    <text x="0" y="225" font-size="10" fill="#7a5a38">每条腿被 2 颗 50mm 螺丝（一颗来自长围裙，一颗来自短围裙）夹紧</text>
  </g>

  <!-- Diagram: seat board fixing -->
  <g transform="translate(560,340)">
    <text x="0" y="-10" font-size="13" font-weight="bold" fill="#3c2a18">B. 凳面板 ↔ 围裙（侧切视图）</text>

    <!-- Seat board (top, 1cm thick) -->
    <rect x="0" y="0" width="300" height="14" fill="url(#hw_wood)" stroke="#5a3c20" stroke-width="1"/>
    <text x="150" y="11" text-anchor="middle" font-size="10" fill="#fff">凳面板 (1 cm 厚)</text>

    <!-- Apron below (3cm tall) -->
    <rect x="30" y="14" width="240" height="40" fill="url(#hw_wood)" stroke="#5a3c20" stroke-width="1"/>
    <text x="150" y="40" text-anchor="middle" font-size="11" fill="#fff">围裙 (3 cm 高)</text>

    <!-- Screws from apron going UP into board -->
    <g stroke="#5c5c64" stroke-width="2">
      <line x1="80" y1="50" x2="80" y2="6"/>
      <line x1="150" y1="50" x2="150" y2="6"/>
      <line x1="220" y1="50" x2="220" y2="6"/>
    </g>
    <g stroke="#888" stroke-width="0.8" stroke-dasharray="2,2">
      <line x1="80" y1="50" x2="80" y2="6"/>
      <line x1="150" y1="50" x2="150" y2="6"/>
      <line x1="220" y1="50" x2="220" y2="6"/>
    </g>
    <g fill="url(#metalHead)" stroke="#3c3c40" stroke-width="0.4">
      <circle cx="80" cy="52" r="4"/>
      <circle cx="150" cy="52" r="4"/>
      <circle cx="220" cy="52" r="4"/>
    </g>

    <text x="80" y="78" text-anchor="middle" font-size="10" fill="#c4392e">螺丝②</text>
    <text x="150" y="78" text-anchor="middle" font-size="10" fill="#c4392e">螺丝②</text>
    <text x="220" y="78" text-anchor="middle" font-size="10" fill="#c4392e">螺丝②</text>
    <text x="150" y="95" text-anchor="middle" font-size="10" fill="#7a5a38">30mm 长，穿透 3cm 围裙 + 进入板 ≈ 0.8cm</text>
  </g>

  <!-- ============ Total table ============ -->
  <g transform="translate(60,580)" font-size="12" fill="#3c2a18">
    <rect x="0" y="0" width="860" height="80" fill="#fff7e6" stroke="#a87042" stroke-width="0.8" rx="6"/>
    <text x="20" y="22" font-weight="bold">总计</text>
    <line x1="20" y1="28" x2="840" y2="28" stroke="#a87042" stroke-width="0.5"/>
    <text x="20" y="48">·  4 × 50 mm 沉头自攻螺丝　×　8 颗</text>
    <text x="320" y="48">·  4 × 30 mm 沉头自攻螺丝　×　8 颗</text>
    <text x="620" y="48">·  3 mm 预钻孔（必须）</text>
    <text x="20" y="68">·  木工胶 　×　1 瓶</text>
    <text x="320" y="68">·  砂纸 80/120/240 目　×　各 1 张</text>
    <text x="620" y="68">·  木蜡油（可选）　×　1 瓶</text>
  </g>
</svg>
