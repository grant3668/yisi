<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="PingFang SC, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="f_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5ebd6"/>
      <stop offset="100%" stop-color="#fbf7ef"/>
    </linearGradient>
    <linearGradient id="f_floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dcc0"/>
      <stop offset="100%" stop-color="#c4a878"/>
    </linearGradient>
    <linearGradient id="f_wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9a86b"/>
      <stop offset="100%" stop-color="#a87042"/>
    </linearGradient>
    <linearGradient id="f_woodLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eac890"/>
      <stop offset="100%" stop-color="#c08855"/>
    </linearGradient>
    <linearGradient id="f_woodDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c6b3c"/>
      <stop offset="100%" stop-color="#6e4a28"/>
    </linearGradient>
    <pattern id="f_grain" patternUnits="userSpaceOnUse" width="80" height="6" patternTransform="rotate(0)">
      <rect width="80" height="6" fill="url(#f_wood)"/>
      <path d="M0 3 Q20 1 40 3 T80 3" stroke="#7a4d22" stroke-width="0.4" fill="none" opacity="0.6"/>
      <path d="M0 1.2 Q20 0 40 1.2 T80 1.2" stroke="#62381a" stroke-width="0.25" fill="none" opacity="0.4"/>
    </pattern>
    <pattern id="f_grainLight" patternUnits="userSpaceOnUse" width="80" height="6">
      <rect width="80" height="6" fill="url(#f_woodLight)"/>
      <path d="M0 3 Q20 1.5 40 3 T80 3" stroke="#8a5828" stroke-width="0.3" fill="none" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="url(#f_sky)"/>
  <!-- Floor -->
  <polygon points="0,460 900,460 900,700 0,700" fill="url(#f_floor)"/>
  <line x1="0" y1="460" x2="900" y2="460" stroke="#a8895a" stroke-width="0.8" opacity="0.4"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#3c2a18">Ch.6  完工成品</text>
  <text x="450" y="64" text-anchor="middle" font-size="12" fill="#7a5a38">44 × 28 × 38 cm · 全部用料：6 木条 + 1 板 + 16 螺丝</text>

  <!-- Shadow on floor -->
  <ellipse cx="450" cy="610" rx="260" ry="20" fill="#000" opacity="0.18"/>

  <!-- ===== The bench (large iso) ===== -->
  <g transform="translate(180,170)">
    <!-- Back-left leg -->
    <polygon points="40,180 70,170 70,440 40,455" fill="url(#f_woodDark)" stroke="#5a3c20" stroke-width="0.8"/>
    <polygon points="70,170 92,180 92,450 70,440" fill="url(#f_wood)" stroke="#5a3c20" stroke-width="0.8"/>

    <!-- Back-right leg -->
    <polygon points="438,108 468,98 468,368 438,383" fill="url(#f_woodDark)" stroke="#5a3c20" stroke-width="0.8"/>
    <polygon points="468,98 490,108 490,378 468,368" fill="url(#f_wood)" stroke="#5a3c20" stroke-width="0.8"/>

    <!-- Back apron (long, far) -->
    <polygon points="92,180 438,108 438,140 92,212" fill="url(#f_woodDark)" stroke="#5a3c20" stroke-width="0.5"/>
    <line x1="92" y1="196" x2="438" y2="124" stroke="#7a4d22" stroke-width="0.4" opacity="0.5"/>

    <!-- Front-left leg -->
    <polygon points="90,272 120,262 120,535 90,550" fill="url(#f_wood)" stroke="#5a3c20" stroke-width="0.8"/>
    <polygon points="120,262 142,272 142,545 120,535" fill="url(#f_woodLight)" stroke="#5a3c20" stroke-width="0.8"/>

    <!-- Front-right leg -->
    <polygon points="488,200 518,190 518,460 488,475" fill="url(#f_wood)" stroke="#5a3c20" stroke-width="0.8"/>
    <polygon points="518,190 540,200 540,470 518,460" fill="url(#f_woodLight)" stroke="#5a3c20" stroke-width="0.8"/>

    <!-- Front apron (long, near) -->
    <polygon points="142,272 488,200 488,232 142,304" fill="url(#f_wood)" stroke="#5a3c20" stroke-width="0.5"/>
    <line x1="142" y1="288" x2="488" y2="216" stroke="#7a4d22" stroke-width="0.4" opacity="0.5"/>

    <!-- Left short apron -->
    <polygon points="92,180 142,272 142,304 92,212" fill="url(#f_woodLight)" stroke="#5a3c20" stroke-width="0.5"/>

    <!-- Seat board top -->
    <polygon points="0,200 380,108 510,148 130,240" fill="url(#f_grain)" stroke="#5a3c20" stroke-width="1.2"/>
    <!-- Seat board left edge (thickness) -->
    <polygon points="0,200 130,240 130,254 0,214" fill="url(#f_woodDark)" stroke="#5a3c20" stroke-width="0.5"/>
    <!-- Seat board front edge (thickness) -->
    <polygon points="130,240 510,148 510,162 130,254" fill="url(#f_woodDark)" stroke="#5a3c20" stroke-width="0.5"/>

    <!-- Highlight on board top -->
    <polygon points="40,194 200,156 220,165 60,205" fill="#fff" opacity="0.12"/>
  </g>

  <!-- Decorative element: small star above to mark "完成" -->
  <g transform="translate(720,140)" opacity="0.85">
    <polygon points="0,-22 6,-7 22,-5 9,5 14,21 0,12 -14,21 -9,5 -22,-5 -6,-7" fill="#e8b556" stroke="#a87042" stroke-width="0.6"/>
    <text x="0" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#a87042">完成！</text>
  </g>

  <!-- Dimension callouts -->
  <g font-size="11" fill="#5a3c20">
    <!-- Height -->
    <line x1="755" y1="370" x2="755" y2="620" stroke="#5a3c20" stroke-width="0.5"/>
    <line x1="750" y1="370" x2="760" y2="370" stroke="#5a3c20" stroke-width="0.5"/>
    <line x1="750" y1="620" x2="760" y2="620" stroke="#5a3c20" stroke-width="0.5"/>
    <text x="765" y="500">高 38</text>
  </g>

  <!-- Bottom stats / quality checks -->
  <g transform="translate(80,640)" font-size="11" fill="#3c2a18">
    <text x="0" y="0" font-weight="bold">完工自检 ✓</text>
    <text x="100" y="0">四脚平稳　·　接缝紧密　·　边角倒圆　·　表面光滑　·　螺丝沉头不外露</text>
  </g>
</svg>
