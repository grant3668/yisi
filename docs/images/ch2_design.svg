<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="PingFang SC, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9a86b"/>
      <stop offset="100%" stop-color="#a87042"/>
    </linearGradient>
    <linearGradient id="woodLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eac890"/>
      <stop offset="100%" stop-color="#d3a872"/>
    </linearGradient>
    <linearGradient id="woodDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c6b3c"/>
      <stop offset="100%" stop-color="#6e4a28"/>
    </linearGradient>
    <linearGradient id="brace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fc8e0"/>
      <stop offset="100%" stop-color="#3a8aaa"/>
    </linearGradient>
    <pattern id="grain" patternUnits="userSpaceOnUse" width="60" height="6">
      <rect width="60" height="6" fill="url(#wood)"/>
      <path d="M0 3 Q15 1 30 3 T60 3" stroke="#7a4d22" stroke-width="0.4" fill="none" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1000" height="780" fill="#fbf7ef"/>

  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#3c2a18">小板凳 设计效果图</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#7a5a38">尺寸 44 × 28 × 38 cm （长 × 宽 × 高）　·　高 = 腿 37 + 凳面板 1</text>

  <!-- ===================================== -->
  <!-- ISO 3D view (right side)              -->
  <!-- Same projection as ch6:              -->
  <!--   svg = (origin_x + 6x + 5.196y,     -->
  <!--          origin_y - 6z - 3y)          -->
  <!-- origin = (560, 470)                   -->
  <!-- ===================================== -->
  <g>
    <text x="740" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c2a18">立体效果</text>

    <!-- Ground shadow -->
    <ellipse cx="750" cy="478" rx="180" ry="14" fill="#000" opacity="0.12"/>

    <!-- Back-LEFT leg: (0,25,0)→(4,28,37). origin (560,470). -->
    <!-- iso(0,25,0)=(689.9,395) iso(4,25,0)=(713.9,395) iso(4,28,0)=(729.49,386) iso(0,28,0)=(705.49,386) -->
    <!-- iso(0,25,37)=(689.9,173) iso(4,25,37)=(713.9,173) iso(4,28,37)=(729.49,164) iso(0,28,37)=(705.49,164) -->
    <g>
      <polygon points="713.9,395 729.49,386 729.49,164 713.9,173" fill="url(#woodDark)" stroke="#5a3c20" stroke-width="0.5"/>
      <polygon points="689.9,395 713.9,395 713.9,173 689.9,173" fill="url(#wood)" stroke="#5a3c20" stroke-width="0.5"/>
      <polygon points="689.9,173 713.9,173 729.49,164 705.49,164" fill="url(#woodLight)" stroke="#5a3c20" stroke-width="0.5"/>
    </g>

    <!-- Back-RIGHT leg: (40,25,0)→(44,28,37) -->
    <!-- iso(40,25,0)=(929.9,395) iso(44,25,0)=(953.9,395) iso(44,28,0)=(969.49,386) -->
    <g>
      <polygon points="953.9,395 969.49,386 969.49,164 953.9,173" fill="url(#woodDark)" stroke="#5a3c20" stroke-width="0.5"/>
      <polygon points="929.9,395 953.9,395 953.9,173 929.9,173" fill="url(#wood)" stroke="#5a3c20" stroke-width="0.5"/>
      <polygon points="929.9,173 953.9,173 969.49,164 945.49,164" fill="url(#woodLight)" stroke="#5a3c20" stroke-width="0.5"/>
    </g>

    <!-- Right SHORT apron H: (40,4,34)→(44,24,37) -->
    <!-- right face: iso(44,4,34)=(844.78,254), iso(44,24,34)=(948.7,194), iso(44,24,37)=(948.7,176), iso(44,4,37)=(844.78,236) -->
    <g>
      <polygon points="844.78,254 948.7,194 948.7,176 844.78,236" fill="url(#woodDark)" stroke="#5a3c20" stroke-width="0.5"/>
      <polygon points="820.78,236 844.78,236 948.7,176 924.7,176" fill="url(#woodLight)" stroke="#5a3c20" stroke-width="0.5"/>
    </g>

    <!-- Right STRETCHER K: (40,4,12)→(44,24,15) -->
    <g>
      <polygon points="844.78,386 948.7,326 948.7,308 844.78,368" fill="url(#brace)" stroke="#1a4570" stroke-width="0.5"/>
      <polygon points="820.78,368 844.78,368 948.7,308 924.7,308" fill="url(#brace)" stroke="#1a4570" stroke-width="0.5" opacity="0.85"/>
      <polygon points="820.78,386 844.78,386 844.78,368 820.78,368" fill="url(#brace)" stroke="#1a4570" stroke-width="0.5"/>
    </g>

    <!-- Front-LEFT leg: (0,0,0)→(4,3,37) -->
    <!-- iso(0,0,0)=(560,470) iso(4,0,0)=(584,470) iso(4,3,0)=(599.59,461) iso(0,3,0)=(575.59,461) -->
    <!-- iso(0,0,37)=(560,248) iso(4,0,37)=(584,248) iso(4,3,37)=(599.59,239) -->
    <g>
      <polygon points="584,470 599.59,461 599.59,239 584,248" fill="url(#woodDark)" stroke="#5a3c20" stroke-width="0.5"/>
      <polygon points="560,470 584,470 584,248 560,248" fill="url(#wood)" stroke="#5a3c20" stroke-width="0.5"/>
      <polygon points="560,248 584,248 599.59,239 575.59,239" fill="url(#woodLight)" stroke="#5a3c20" stroke-width="0.5"/>
    </g>

    <!-- Front-RIGHT leg: (40,0,0)→(44,3,37) -->
    <g>
      <polygon points="824,470 839.59,461 839.59,239 824,248" fill="url(#woodDark)" stroke="#5a3c20" stroke-width="0.5"/>
      <polygon points="800,470 824,470 824,248 800,248" fill="url(#wood)" stroke="#5a3c20" stroke-width="0.5"/>
      <polygon points="800,248 824,248 839.59,239 815.59,239" fill="url(#woodLight)" stroke="#5a3c20" stroke-width="0.5"/>
    </g>

    <!-- Front LONG apron E: (4,0,34)→(40,3,37) -->
    <g>
      <polygon points="800,266 815.59,257 815.59,239 800,248" fill="url(#woodDark)" stroke="#5a3c20" stroke-width="0.5"/>
      <polygon points="584,266 800,266 800,248 584,248" fill="url(#wood)" stroke="#5a3c20" stroke-width="0.5"/>
      <polygon points="584,248 800,248 815.59,239 599.59,239" fill="url(#woodLight)" stroke="#5a3c20" stroke-width="0.5"/>
    </g>

    <!-- Seat board: (0,0,37)→(44,28,38) -->
    <!-- top: (560,242)-(824,242)-(969.49,158)-(705.49,158) -->
    <g>
      <polygon points="824,248 969.49,164 969.49,158 824,242" fill="url(#woodDark)" stroke="#5a3c20" stroke-width="0.5"/>
      <polygon points="560,248 824,248 824,242 560,242" fill="url(#wood)" stroke="#5a3c20" stroke-width="0.5"/>
      <polygon points="560,242 824,242 969.49,158 705.49,158" fill="url(#grain)" stroke="#5a3c20" stroke-width="0.8"/>
    </g>

    <!-- Annotations -->
    <text x="510" y="220" font-size="11" fill="#5a3c20">凳面板</text>
    <line x1="555" y1="218" x2="600" y2="232" stroke="#5a3c20" stroke-width="0.5"/>

    <text x="510" y="260" font-size="11" fill="#5a3c20">长围裙</text>
    <line x1="555" y1="258" x2="595" y2="260" stroke="#5a3c20" stroke-width="0.5"/>

    <text x="510" y="350" font-size="11" fill="#5a3c20">腿 37</text>
    <line x1="540" y1="348" x2="565" y2="360" stroke="#5a3c20" stroke-width="0.5"/>

    <text x="510" y="380" font-size="11" fill="#3a8aaa" font-weight="bold">侧横档 J/K</text>
    <line x1="555" y1="378" x2="830" y2="378" stroke="#3a8aaa" stroke-width="0.5" stroke-dasharray="3,2"/>
    <text x="510" y="394" font-size="9" fill="#7a5a38">距地 12 cm</text>
  </g>

  <!-- ===================================== -->
  <!-- Top view (top-left): 44 × 28, scale 8 px/cm -->
  <!-- ===================================== -->
  <g transform="translate(60,110)">
    <text x="190" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c2a18">俯视图 (Top)</text>

    <!-- Board outline -->
    <rect x="30" y="20" width="352" height="224" fill="url(#grain)" stroke="#5a3c20" stroke-width="1"/>
    <g stroke="#7a4d22" stroke-width="0.4" opacity="0.4" fill="none">
      <path d="M30 60 Q206 56 382 62"/>
      <path d="M30 110 Q206 106 382 112"/>
      <path d="M30 160 Q206 156 382 162"/>
      <path d="M30 210 Q206 206 382 212"/>
    </g>

    <!-- Apron frame (dashed, inset 4 cm = 32 px) -->
    <rect x="62" y="52" width="288" height="160" fill="none" stroke="#5a3c20" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.7"/>

    <!-- Leg positions (dashed squares, 4×3 cm = 32×24 px) -->
    <g stroke="#5a3c20" stroke-width="0.8" stroke-dasharray="3,2" fill="none" opacity="0.7">
      <rect x="62" y="52" width="32" height="24"/>
      <rect x="318" y="52" width="32" height="24"/>
      <rect x="62" y="188" width="32" height="24"/>
      <rect x="318" y="188" width="32" height="24"/>
    </g>

    <!-- Stretchers (dashed, hidden underneath) -->
    <g stroke="#3a8aaa" stroke-width="1.2" stroke-dasharray="6,3" fill="none" opacity="0.8">
      <line x1="78" y1="76" x2="78" y2="188"/>
      <line x1="334" y1="76" x2="334" y2="188"/>
    </g>
    <text x="92" y="135" font-size="9" fill="#3a8aaa">J 横档</text>
    <text x="295" y="135" font-size="9" fill="#3a8aaa">K 横档</text>

    <!-- Dimensions -->
    <g font-size="10" fill="#5a3c20">
      <line x1="30" y1="10" x2="382" y2="10" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="30" y1="5" x2="30" y2="15" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="382" y1="5" x2="382" y2="15" stroke="#5a3c20" stroke-width="0.5"/>
      <text x="206" y="-2" text-anchor="middle">44 cm</text>

      <line x1="397" y1="20" x2="397" y2="244" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="392" y1="20" x2="402" y2="20" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="392" y1="244" x2="402" y2="244" stroke="#5a3c20" stroke-width="0.5"/>
      <text x="407" y="135">28</text>

      <text x="206" y="135" text-anchor="middle" font-size="9" fill="#7a5a38" opacity="0.7">围裙框 36×20</text>
    </g>

    <text x="76" y="65" font-size="8" fill="#5a3c20">腿</text>
    <text x="190" y="280" text-anchor="middle" font-size="9" fill="#7a5a38">蓝虚线 = 横档（在腿之间，从上方看不到）</text>
  </g>

  <!-- ===================================== -->
  <!-- Front view: 44 wide × 38 tall, scale 7 px/cm -->
  <!-- ===================================== -->
  <g transform="translate(60,470)">
    <text x="190" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c2a18">正视图 (Front)</text>

    <!-- Seat board (z=37..38, 1cm tall = 7px) -->
    <rect x="30" y="40" width="308" height="7" fill="url(#wood)" stroke="#5a3c20" stroke-width="0.8"/>
    <!-- Front apron (z=34..37) -->
    <rect x="58" y="47" width="252" height="21" fill="url(#woodLight)" stroke="#5a3c20" stroke-width="0.8"/>
    <!-- Front-LEFT leg (z=0..37, 4cm wide = 28px) -->
    <rect x="58" y="47" width="28" height="259" fill="url(#wood)" stroke="#5a3c20" stroke-width="0.8"/>
    <!-- Front-RIGHT leg -->
    <rect x="282" y="47" width="28" height="259" fill="url(#wood)" stroke="#5a3c20" stroke-width="0.8"/>

    <!-- Stretcher ENDS (visible at z=12..15 = 70..91px from board, but front view shows depth so we see endpoints behind legs as faint outlines)
         Actually in true front view, stretchers J/K run perpendicular to view, so we see them end-on through the legs - just dashed outlines on the legs at that height -->
    <g stroke="#3a8aaa" stroke-width="1" stroke-dasharray="3,2" fill="none">
      <rect x="58" y="222" width="28" height="21"/>
      <rect x="282" y="222" width="28" height="21"/>
    </g>
    <text x="172" y="237" text-anchor="middle" font-size="9" fill="#3a8aaa">横档（端面，藏在腿后）</text>

    <!-- Floor line -->
    <line x1="10" y1="306" x2="358" y2="306" stroke="#5a3c20" stroke-width="0.6"/>

    <!-- Dimensions -->
    <g font-size="10" fill="#5a3c20">
      <line x1="30" y1="28" x2="338" y2="28" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="30" y1="23" x2="30" y2="33" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="338" y1="23" x2="338" y2="33" stroke="#5a3c20" stroke-width="0.5"/>
      <text x="184" y="20" text-anchor="middle">44 cm</text>

      <line x1="373" y1="40" x2="373" y2="306" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="368" y1="40" x2="378" y2="40" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="368" y1="306" x2="378" y2="306" stroke="#5a3c20" stroke-width="0.5"/>
      <text x="380" y="175">38</text>

      <!-- Stretcher height dim -->
      <line x1="-10" y1="222" x2="-10" y2="306" stroke="#3a8aaa" stroke-width="0.5"/>
      <line x1="-15" y1="222" x2="-5" y2="222" stroke="#3a8aaa" stroke-width="0.5"/>
      <line x1="-15" y1="306" x2="-5" y2="306" stroke="#3a8aaa" stroke-width="0.5"/>
      <text x="-30" y="266" font-size="9" fill="#3a8aaa">12 cm</text>

      <text x="40" y="55" font-size="9" fill="#7a5a38">板 1 cm</text>
      <text x="100" y="60" font-size="9" fill="#7a5a38">围裙 3 cm</text>
      <text x="20" y="175" font-size="9" fill="#7a5a38" transform="rotate(-90 20 175)">腿 37 cm</text>
    </g>
  </g>

  <!-- ===================================== -->
  <!-- Side view: 28 deep × 38 tall, scale 7 px/cm -->
  <!-- Now shows the stretcher FACE clearly -->
  <!-- ===================================== -->
  <g transform="translate(540,470)">
    <text x="120" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c2a18">侧视图 (Side)</text>

    <!-- Seat board (z=37..38, 28 cm deep = 196px) -->
    <rect x="20" y="40" width="196" height="7" fill="url(#wood)" stroke="#5a3c20" stroke-width="0.8"/>
    <!-- Short apron (between legs at top) -->
    <rect x="48" y="47" width="140" height="21" fill="url(#woodLight)" stroke="#5a3c20" stroke-width="0.8"/>
    <!-- Side leg 1 (z=0..37) -->
    <rect x="48" y="47" width="28" height="259" fill="url(#wood)" stroke="#5a3c20" stroke-width="0.8"/>
    <!-- Side leg 2 -->
    <rect x="160" y="47" width="28" height="259" fill="url(#wood)" stroke="#5a3c20" stroke-width="0.8"/>

    <!-- Stretcher visible face: z=12..15 (84..105 from board bottom z=38; in svg: 47 + (38-15)*7 = 47 + 161 = 208 to 47 + (38-12)*7 = 47+182 = 229) -->
    <rect x="48" y="208" width="140" height="21" fill="url(#brace)" stroke="#1a4570" stroke-width="0.8"/>
    <text x="118" y="222" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">横档 J / K (20)</text>

    <!-- Floor line -->
    <line x1="0" y1="306" x2="236" y2="306" stroke="#5a3c20" stroke-width="0.6"/>

    <!-- Dimensions -->
    <g font-size="10" fill="#5a3c20">
      <line x1="20" y1="28" x2="216" y2="28" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="20" y1="23" x2="20" y2="33" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="216" y1="23" x2="216" y2="33" stroke="#5a3c20" stroke-width="0.5"/>
      <text x="118" y="20" text-anchor="middle">28 cm</text>

      <line x1="251" y1="40" x2="251" y2="306" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="246" y1="40" x2="256" y2="40" stroke="#5a3c20" stroke-width="0.5"/>
      <line x1="246" y1="306" x2="256" y2="306" stroke="#5a3c20" stroke-width="0.5"/>
      <text x="258" y="175">38</text>

      <!-- Stretcher dimensions: distance from floor to BOTTOM of stretcher (z=12) -->
      <line x1="-10" y1="229" x2="-10" y2="306" stroke="#3a8aaa" stroke-width="0.5"/>
      <line x1="-15" y1="229" x2="-5" y2="229" stroke="#3a8aaa" stroke-width="0.5"/>
      <line x1="-15" y1="306" x2="-5" y2="306" stroke="#3a8aaa" stroke-width="0.5"/>
      <text x="-30" y="270" font-size="9" fill="#3a8aaa">12 cm</text>

      <text x="100" y="60" font-size="9" fill="#7a5a38">短围裙 20</text>
    </g>
  </g>

  <!-- Legend / cut list -->
  <g transform="translate(60,740)" font-size="11" fill="#3c2a18">
    <text x="0" y="0" font-weight="bold">下料：</text>
    <text x="50" y="0">4×腿 37cm（取自 75/74）</text>
    <text x="240" y="0">·</text>
    <text x="255" y="0">2×长围裙 36cm + 2×横档 20cm（取自 63/63）</text>
    <text x="600" y="0">·</text>
    <text x="615" y="0">2×短围裙 20cm（取自 33/35）</text>
    <text x="860" y="0">·</text>
    <text x="875" y="0">凳面 28×44</text>
  </g>
</svg>
